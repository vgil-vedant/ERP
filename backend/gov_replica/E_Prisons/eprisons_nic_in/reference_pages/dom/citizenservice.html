    <script>
        function getCodeBoxElement(index) {
        return document.getElementById('codeBox' + index);
      }
        function onKeyUpEvent(index, event) {
        const eventCode = event.which || event.keyCode;
        if (getCodeBoxElement(index).value.length === 1) {
          if (index !== 6) {
            getCodeBoxElement(index+ 1).focus();
          } else {
            getCodeBoxElement(index).blur();
            // Submit code
            console.log('submit code ');
          }
        }
        if (eventCode === 8 && index !== 1) {
          getCodeBoxElement(index - 1).focus();
        }
      }
        function onFocusEvent(index) {
        for (item = 1; item < index; item++) {
          const currentElement = getCodeBoxElement(item);
          if (!currentElement.value) {
              currentElement.focus();
              break;
          }
        }
      }
        //----------------------------Timer------------------------------------------
        function countdown(element, minutes, seconds,flag) {
            if ($('#clock').length) {
                /* it exists */
            }
            else {
                return;
            }
            // set time for the particular countdown
            var time = minutes * 60 + seconds;
            var interval = setInterval(function () {
                var el = document.getElementById(element);
                // if the time is 0 then end the counter
                if (time <= 0) {
                    if (flag) {
                        $.ajax({
                            type: 'POST',
                            url: '/CitiZenService/Login/ResendOTPToken', // we are calling json method
                            dataType: 'json',
                            success: function (data) {
                                var link = $("<a>");
                                link.attr("href", "javascript:void(0);");
                                link.attr("onclick", "resendOTP('" + data + "');");
                                link.text("Resend OTP");
                                //link.addClass("link");
                                //var text = "<a href='javascript:void(0)' onclick='resendOTP(' " + data + " '" + ");'>Resend OTP</a>";
                                $(el).html(link)
                            },
                            error: function (ex) {
                                toastr.error('OTP not sent.' + ex);
                            }
                        });
                    } else {
                        var text = "<a href='/CitiZenService/'>Try again<a>";
                        el.innerHTML = text;
                    }
                    clearInterval(interval);
                    return;
                }
                var minutes = Math.floor(time / 60);
                if (minutes < 10) minutes = "0" + minutes;
                var seconds = time % 60;
                if (seconds < 10) seconds = "0" + seconds;
                var text = minutes + ':' + seconds;
                el.innerHTML = text;
                time--;
            }, 1000);
        }
        countdown('clock', 0, 180, true);
        function resendOTP(token) {
            $.ajax({
                type: 'POST',
                url: '/CitiZenService/Login/ResendOTP', // we are calling json method
                dataType: 'json',
                data: { token: token },
                success: function (data) {
                    countdown('clock', 0, 180, false);
                },
                error: function (ex) {
                    toastr.error('Contact administrator.' + ex);
                }
            });
        }

            }
        }

        // Popup hover logic
       
        document.addEventListener("DOMContentLoaded", function () {
            var container = document.querySelector('.user-container');

            if (container) {
                var popup = container.querySelector('.user-popup');
                var isLockedByClick = false; 
                function showPopup() {
                    popup.style.display = 'block';
                    setTimeout(() => popup.style.opacity = '1', 10);
                }
                function hidePopup() {
                    if (!isLockedByClick) { 
                        popup.style.opacity = '0';
                        setTimeout(() => popup.style.display = 'none', 150);
                    }
                }
             
                container.addEventListener('mouseenter', function () {
                    showPopup();
                });

                container.addEventListener('mouseleave', function () {
                    hidePopup();
                });
                
                container.addEventListener('click', function (e) {
                    e.stopPropagation(); 

                    isLockedByClick = !isLockedByClick; 

                    if (isLockedByClick) {
                        showPopup();
                    } else {
                        
                        isLockedByClick = false;
                        popup.style.opacity = '0';
                        setTimeout(() => popup.style.display = 'none', 150);
                    }
                });

                document.addEventListener('click', function (e) {
                    if (!container.contains(e.target)) {
                        isLockedByClick = false; 
                        popup.style.opacity = '0';
                        setTimeout(() => popup.style.display = 'none', 150);
                    }
                });
            }
        });
    </script>
