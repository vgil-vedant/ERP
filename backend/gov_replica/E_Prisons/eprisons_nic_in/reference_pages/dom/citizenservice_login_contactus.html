    <script>
    "use strict";
    var Dashboard = function () {
        var global = {
            tooltipOptions: {
                placement: "right"
            },
            menuClass: ".c-menu"
        };
        var menuChangeActive = function menuChangeActive(el) {
            var hasSubmenu = $(el).hasClass("has-submenu");
            $(global.menuClass + " .is-active").removeClass("is-active");
            $(el).addClass("is-active");
            if (hasSubmenu) {
                $(el).find("ul").slideToggle();
            }
        };
        var sidebarChangeWidth = function sidebarChangeWidth() {
            var $menuItemsTitle = $("li .menu-item__title");
            $("body").toggleClass("sidebar-is-reduced sidebar-is-expanded");
            $(".hamburger-toggle").toggleClass("is-opened");

            if ($("body").hasClass("sidebar-is-expanded")) {
                $.ajax({
                    type: 'POST',
                    url: '/CitiZenService/Login/SetSideBar', // we are calling json method
                    dataType: 'json',
                    data: { val: "expand" },
                    success: function (data) {
                    },
                    error: function (ex) {
                        toastr.error('sidebar state not saved.' + ex);
                    }
                });
                $('[data-toggle="tooltip"]').tooltip("destroy");
            } else {
                $.ajax({
                    type: 'POST',
                    url: '/CitiZenService/Login/SetSideBar', // we are calling json method
                    dataType: 'json',
                    data: { val: "collapse" },
                    success: function (data) {
                    },
                    error: function (ex) {
                        toastr.error('sidebar state not saved.' + ex);
                    }
                });
                $('[data-toggle="tooltip"]').tooltip(global.tooltipOptions);
            }
        };
        return {
            init: function init() {
                $(".js-hamburger").on("click", sidebarChangeWidth);

                $(".js-menu li").on("click", function (e) {
                    menuChangeActive(e.currentTarget);
                });

                $('[data-toggle="tooltip"]').tooltip(global.tooltipOptions);
            }
        };
    }();
    Dashboard.init();
    $(".counter").click(function () {
            window.location = $(this).find("a").attr("href");
            return false;
    });
    function showPrisoner(pid, fir) {
            displayBusyIndicator();
            $.ajax({
                type: 'POST',
                url: '/CitiZenService/Prisoner/SelectPrisoner',
                data: JSON.stringify({ PID: pid, FIR: fir }),
                contentType: "application/json;charset=utf-8",
                dataType: "json",
                success: function (data) {
                    hideBusyIndicator();
                    $("#pMenuDiv").show();
                    $("#pMenu").removeAttr("onclick");
                    var d = JSON.parse(data);
                    //$("#stock_available").text(d.Stock + " " + d.Product.UnitMasterCanteen.UnitDesc);
                    $("#imgPrisoner, #imgProfilePicture").attr('src', d.Photo);
                    $("#pName, #pname").html(d.Prisoner_Name);
                    $("#pPid, #ppid").html(d.PID_No);
                    $("#pLocation").html(d.LastPrisonerEntry.Location);
                    $("#paddress").html(d.Present_Add);
                    $("#pjid").html(d.LastPrisonerEntry.JID_No);
                    $("#pfathername").html(d.Father_Name);
                    $("#page").html(d.age);
                    $("#pGender").html(d.Sex_Code);
                    var attrval = "showPrisoner('" + pid + "','" + fir + "')";
                    $("#pMenu").attr("onclick", attrval);
                    $('#btnSelectPID').show();
                    $('#exampleModal').modal('show');
                },
                error: function (ex) {
                    hideBusyIndicator();
                    toastr.error('Failed to retrieve data.' + ex);
                }
            });
    };
  

if (window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);

        // Popup hover logic
       
        document.addEventListener("DOMContentLoaded", function () {
            var container = document.querySelector('.user-container');

            if (container) {
                var popup = container.querySelector('.user-popup');
                var isLockedByClick = false; 
                function showPopup() {
                    popup.style.display = 'block';
                    setTimeout(() => popup.style.opacity = '1', 10);
                }
                function hidePopup() {
                    if (!isLockedByClick) { 
                        popup.style.opacity = '0';
                        setTimeout(() => popup.style.display = 'none', 150);
                    }
                }
             
                container.addEventListener('mouseenter', function () {
                    showPopup();
                });

                container.addEventListener('mouseleave', function () {
                    hidePopup();
                });
                
                container.addEventListener('click', function (e) {
                    e.stopPropagation(); 

                    isLockedByClick = !isLockedByClick; 

                    if (isLockedByClick) {
                        showPopup();
                    } else {
                        
                        isLockedByClick = false;
                        popup.style.opacity = '0';
                        setTimeout(() => popup.style.display = 'none', 150);
                    }
                });

                document.addEventListener('click', function (e) {
                    if (!container.contains(e.target)) {
                        isLockedByClick = false; 
                        popup.style.opacity = '0';
                        setTimeout(() => popup.style.display = 'none', 150);
                    }
                });
            }
        });
    </script>
